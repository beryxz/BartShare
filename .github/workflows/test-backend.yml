name: Run app-backend tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./app/backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: 'npm'
          cache-dependency-path: './app/backend/package-lock.json'
      - run: npm ci
      - run: npm run prettier:check
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm test -- --reporter=terse --coverage-report=text-summary
