name: Run app-frontend tests

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ./app/frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Use Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: 'npm'
          cache-dependency-path: './app/frontend/package-lock.json'
      - name: Cache Next.js build
        uses: actions/cache@v6
        with:
          path: app/frontend/.next/cache
          key: ${{ runner.os }}-nextjs-${{ hashFiles('app/frontend/package-lock.json') }}-${{ hashFiles('app/frontend/src/**') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-${{ hashFiles('app/frontend/package-lock.json') }}-
      - run: npm ci
      - run: npm run prettier:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build --if-present
      - run: npm test
