user nginx;
worker_processes auto;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
}

http {
    # remove nginx version in responses
    server_tokens off;
    proxy_pass_header Server;

    # logging
    access_log off;
    error_log /var/log/nginx/error.log;

    # Content serving options
    autoindex off;
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Docker's embedded DNS. Upstream names resolve per request
    resolver 127.0.0.11 valid=10s ipv6=off;

    # frontend + backend
    server {
        listen 80;
        listen [::]:80;

        location / {
            # required to resolve host at runtime. NO trailing slash
            set $frontend http://app-frontend:3000;
            proxy_pass $frontend;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";

            limit_except GET HEAD OPTIONS { deny all; }
        }
        location /api/ {
            # required to resolve host at runtime. NO trailing slash
            set $backend http://app-backend:8081;
            proxy_pass $backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "close";

            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_set_header X-Forwarded-Host $host;

            # user uploads
            client_max_body_size 50m;

            limit_except GET POST HEAD OPTIONS PATCH PUT DELETE { deny all; }
        }
    }
}
